<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Cards 1080×1350</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;800;900&display=block">
<style>
  /* Um card do carrossel por vez: cards.html?card=1..5. 1080×1350 (Instagram 4:5). */
  :root { --verde: #1ed760; --ve1: #00342a; --ve2: #00231b; --cinza: #8f979c; --suave: #b9bfc2; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; }
  body { font-family: "Inter", Arial, sans-serif; color: #fff; }
  .card { position: relative; width: 1080px; height: 1350px; padding: 64px 76px 56px; display: flex; flex-direction: column;
    background: radial-gradient(90% 70% at 100% 0%, rgba(30,215,96,.42) 0%, rgba(0,52,42,.45) 32%, rgba(0,0,0,0) 65%), #000; }
  .topo { display: flex; justify-content: space-between; font-size: 26px; padding-bottom: 18px;
    border-bottom: 2px solid transparent; border-image: linear-gradient(90deg, var(--verde), rgba(30,215,96,0)) 1; }
  .topo .n { color: var(--suave); font-weight: 300; }
  h1 { font-size: 62px; line-height: 1.06; font-weight: 800; letter-spacing: -.025em; margin-top: 56px; }
  h1 em, h2 em, .v em { font-style: normal; color: var(--verde); }
  .sub { font-size: 29px; line-height: 1.4; font-weight: 300; color: #d9dddf; margin-top: 22px; }
  .corpo { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .rodape { font-size: 19px; line-height: 1.45; color: var(--suave); font-weight: 300; padding-top: 18px;
    border-top: 1px solid #1f2b27; }
  .rodape b { color: #fff; font-weight: 700; }

  /* capa */
  .capa h1 { font-size: 112px; margin-top: auto; }
  .capa .sub { font-size: 36px; max-width: 820px; }
  .seta { margin: 64px 0 40px; font-size: 30px; color: var(--verde); font-weight: 700; display: flex; align-items: center; gap: 18px; }
  .seta i { display: inline-block; width: 120px; height: 3px; background: var(--verde); position: relative; }
  .seta i::after { content: ""; position: absolute; right: -2px; top: -8px; border: 9px solid transparent; border-left: 14px solid var(--verde); border-right: 0; }

  /* barras */
  .barras { display: grid; gap: 14px; position: relative; }
  .linha .nome { font-size: 29px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
  .linha .nome span { font-weight: 800; font-variant-numeric: tabular-nums; }
  .linha .nome small { font-size: 22px; font-weight: 300; color: var(--suave); margin-left: 10px; }
  .trilho { position: relative; height: 26px; margin-top: 8px; }
  .barra { position: absolute; left: 0; top: 0; height: 26px; border-radius: 5px; background: var(--verde); }
  .barra.hipo { background: var(--ve1); box-shadow: inset 0 0 0 3px var(--verde); }
  .barra.ref { background: var(--cinza); }
  .barra.parado { background: #000; box-shadow: inset 0 0 0 3px var(--cinza); }
  .leg { display: flex; flex-wrap: wrap; gap: 10px 26px; font-size: 21px; color: var(--suave); margin-top: 18px; margin-bottom: 30px; }
  .leg span { display: inline-flex; align-items: center; gap: 10px; }
  .leg i { display: inline-block; width: 30px; height: 16px; border-radius: 3px; background: var(--verde); }
  .leg i.hipo { background: var(--ve1); box-shadow: inset 0 0 0 2px var(--verde); }
  .leg i.tr { width: 0; height: 26px; border-radius: 0; background: none; border-left: 3px dashed #fff; margin: 0 6px; }
  .leg i.parado { background: #000; box-shadow: inset 0 0 0 2px var(--cinza); }
  .extra { font-size: 21px; color: var(--suave); font-weight: 300; margin-top: 6px; }
  .extra b { color: #fff; font-weight: 700; }
  .marco { position: absolute; top: -14px; bottom: -6px; border-left: 3px dashed #fff; }
  .marco span { position: absolute; top: -38px; left: -4px; transform: translateX(-50%); white-space: nowrap; font-size: 20px; color: #fff; }

  /* números grandes */
  .grandes { display: grid; gap: 34px; }
  .g { display: grid; grid-template-columns: 1fr auto; align-items: end; padding-bottom: 26px; border-bottom: 1px solid #1f2b27; }
  .g .nome { font-size: 32px; font-weight: 700; }
  .g .nome small { display: block; font-size: 22px; font-weight: 300; color: var(--suave); margin-top: 4px; }
  .g .v { font-size: 64px; font-weight: 800; color: var(--verde); letter-spacing: -.02em; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
  .g .v small { display: block; font-size: 24px; color: #fff; font-weight: 400; letter-spacing: 0; margin-top: 8px; }
  .nota { font-size: 24px; color: #d9dddf; font-weight: 300; line-height: 1.45; margin-top: 30px; padding: 22px 26px; background: var(--ve2); border-radius: 16px; }
  .nota b { color: var(--verde); font-weight: 700; }

  /* inflação */
  .blocos { display: grid; gap: 30px; }
  .bloco { background: var(--ve2); border: 1px solid #0d3a2e; border-radius: 20px; padding: 34px 38px; }
  .bloco .v { font-size: 92px; font-weight: 900; letter-spacing: -.03em; line-height: 1; color: var(--verde); }
  .bloco p { font-size: 29px; line-height: 1.4; font-weight: 300; margin-top: 14px; color: #e3e6e7; }

  /* método */
  .metodo { display: grid; gap: 22px; }
  .metodo p { font-size: 26px; line-height: 1.42; font-weight: 300; color: #e3e6e7; padding-left: 26px; border-left: 3px solid var(--verde); }
  .metodo p b { font-weight: 700; color: #fff; }
  .aviso { margin-top: 34px; border: 2px solid var(--verde); border-radius: 18px; padding: 22px 28px; font-size: 24px; line-height: 1.4; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
(async function () {
  const R = await (await fetch("dados/resumo.json", { cache: "no-cache" })).json();
  const A = Object.fromEntries(R.ativos.map(a => [a.id, a]));
  const n = +(new URLSearchParams(location.search).get("card") || 1);
  const nf = d => new Intl.NumberFormat("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
  const mil = v => "R$ " + nf(v < 1e5 ? 1 : 0).format(v / 1e3) + " mil";
  const mil1 = v => "R$ " + nf(1).format(v / 1e3) + " mil";
  const mi = v => "R$ " + nf(1).format(v / 1e6) + (v >= 2e6 ? " milhões" : " milhão");
  const pct = x => Math.abs(x) < 5e-4 ? "0%" : (x >= 0 ? "+" : "−") + nf(1).format(Math.abs(x * 100)) + "%";
  const vezes = v => nf(v / R.capital >= 100 ? 0 : 1).format(v / R.capital) + "×";
  const data = s => s.slice(8, 10) + "/" + s.slice(5, 7) + "/" + s.slice(0, 4);
  const mes = s => ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"][+s.slice(5, 7) - 1] + "/" + s.slice(0, 4);
  const fim = ["ibov", "petr4", "sp500", "nvda", "ttwo"].map(k => A[k].d1).sort().pop();
  const total = 6;
  const topo = `<div class="topo"><span>Liberta Investimentos</span><span class="n">${n}/${total}</span></div>`;
  const aviso = "Rentabilidade passada não é garantia de rentabilidade futura. Simulação educativa, sem impostos e custos.";
  const fonte = t => `<div class="rodape">${t}<br>${aviso}</div>`;
  const el = document.getElementById("card");
  let h = "";

  if (n === 1) {
    el.classList.add("capa");
    h = `${topo}
      <h1>R$ 100 mil investidos em 2013.<br><em>Quanto valem hoje?</em></h1>
      <p class="sub">CDI, Bolsa, Petrobras, S&P 500, Nvidia, bitcoin, dólar, petróleo e gasolina, contra a inflação: 17/11/2013 a 17/11/2026, em reais.</p>
      <div class="seta">Arraste para ver <i></i></div>
      ${fonte(`Fechamento de ${data(fim)}. Fontes: Banco Central, IBGE, ANP, B3 e Yahoo Finance.`)}`;
  }

  // Barras horizontais em escala linear a partir de zero; chave = "hoje" (nominal) ou "hoje_real" (poder de compra de 2013)
  function barras(ids, chave, marcoValor, marcoTexto) {
    const nomes = { cdi: "CDI", ibov: "Ibovespa", dolar: "Dólar", gasolina: "Gasolina", petr4: "Petrobras (PETR4)", brent: "Petróleo Brent",
                    ipca: "Inflação (IPCA)", parado: "Dinheiro parado" };
    const pega = k => k === "parado" ? R.parado : A[k];
    const val = k => pega(k)[chave];
    const varia = k => chave === "hoje" ? (k === "parado" ? 0 : A[k].var_brl) : (k === "parado" ? R.parado.real : A[k].real);
    const max = Math.max(...ids.map(val)) * 1.04, W = 928;
    const linhas = ids.map(k => {
      const a = pega(k);
      const cls = k === "ipca" ? "ref" : k === "parado" ? "parado" : a.tipo.startsWith("Preço") ? "hipo" : "";
      const extra = k === "petr4" ? `<div class="extra">com dividendos reinvestidos: <b>${mil(chave === "hoje" ? a.hoje_tr : a.hoje_tr / R.fator_ipca)}</b></div>` : "";
      return `<div class="linha"><div class="nome">${nomes[k]}<span>${mil(val(k))}<small>${pct(varia(k))}</small></span></div>
        <div class="trilho"><div class="barra ${cls}" style="width:${val(k) / max * W}px"></div></div>${extra}</div>`;
    }).join("");
    return `<div class="corpo"><div class="barras">${linhas}
      <div class="marco" style="left:${marcoValor / max * W}px"></div></div></div>`;
  }
  const legenda = t => `<div class="leg"><span><i></i>investimento</span><span><i class="hipo"></i>preço (hipotético)</span><span><i class="parado"></i>parado</span><span><i class="tr"></i>${t}</span></div>`;

  if (n === 2) {
    h = `${topo}
      <h1>R$ 100 mil de 2013, hoje: <em>CDI, Bolsa, dólar e combustíveis</em></h1>
      <p class="sub">Valor em reais em ${data(fim)}, sem descontar a inflação. A linha tracejada é o que só repõe o IPCA.</p>
      ${legenda("repõe a inflação")}
      ${barras(["cdi", "ibov", "dolar", "gasolina", "petr4", "brent", "ipca", "parado"], "hoje", R.ipca.necessario, "repõe a inflação")}
      ${fonte("Fontes: Banco Central (CDI, dólar PTAX), B3 via Yahoo Finance, ANP, IBGE.")}`;
  }

  if (n === 3) {
    h = `${topo}
      <h1>Os mesmos R$ 100 mil, <em>descontada a inflação</em></h1>
      <p class="sub">Quanto cada aplicação compra hoje, em dinheiro de 2013. Abaixo da linha tracejada, perdeu poder de compra.</p>
      ${legenda("poder de compra de 2013")}
      ${barras(["cdi", "ibov", "dolar", "gasolina", "petr4", "brent", "parado"], "hoje_real", R.capital, "poder de compra de 2013")}
      ${fonte("Valores divididos pelo IPCA acumulado de nov/2013 a " + mes(R.ipca.mes1) + " (+" + nf(1).format(R.ipca.acumulada * 100) + "%). Fontes: Banco Central, B3, ANP, IBGE.")}`;
  }

  if (n === 4) {
    const ids = ["nvda", "btc", "ttwo", "sp500"];
    const nomes = { nvda: ["Nvidia", "ação, Nasdaq"], btc: ["Bitcoin", "criptomoeda"], ttwo: ["Take-Two", "dona da Rockstar Games"], sp500: ["S&P 500", "índice da Bolsa americana"] };
    const rows = ids.map(k => `<div class="g"><div class="nome">${nomes[k][0]}<small>${nomes[k][1]}</small></div>
      <div class="v">${mi(A[k].hoje)}<small>${vezes(A[k].hoje)} o valor aplicado · ${A[k].hoje_real >= 1e6 ? mi(A[k].hoje_real) : mil(A[k].hoje_real)} em dinheiro de 2013</small></div></div>`).join("");
    const d = A.dolar;
    h = `${topo}
      <h1>R$ 100 mil de 2013, hoje: <em>ativos no exterior</em></h1>
      <p class="sub">Para quem trocou reais por dólares em 2013 e trocou de volta em ${data(fim)}.</p>
      <div class="corpo"><div class="grandes">${rows}</div>
      <div class="nota">Parte do ganho é o câmbio: o dólar foi de <b>R$ ${nf(2).format(d.v0)}</b> para <b>R$ ${nf(2).format(A.nvda.fx1)}</b>. Preço da Nvidia corrigido pelos desdobramentos de 2021 e 2024.</div></div>
      ${fonte("Fontes: Yahoo Finance (Nasdaq, S&P), CoinMetrics (bitcoin), Banco Central (PTAX).")}`;
  }

  if (n === 5) {
    const i = R.ipca;
    h = `${topo}
      <h1>O que a inflação fez com <em>R$&nbsp;100&nbsp;mil</em></h1>
      <p class="sub">IPCA acumulado de nov/2013 a ${mes(i.mes1)}: <b style="color:#fff;font-weight:700">${pct(i.acumulada)}</b>. Os preços mais que dobraram.</p>
      <div class="corpo"><div class="blocos">
        <div class="bloco"><div class="v">${mil1(i.poder_compra)}</div><p>é o que R$ 100 mil guardados desde 2013 compram hoje, em dinheiro da época. Uma perda de ${nf(0).format(i.perda * 100)}% do poder de compra.</p></div>
        <div class="bloco"><div class="v">${mil1(i.necessario)}</div><p>é quanto você precisa ter hoje para comprar o mesmo que R$ 100 mil compravam em 2013.</p></div>
      </div></div>
      ${fonte("Fonte: IBGE (IPCA, número-índice).")}`;
  }

  if (n === 6) {
    h = `${topo}
      <h1>Como fizemos <em>a conta</em></h1>
      <div class="corpo"><div class="metodo">
        <p><b>Datas.</b> 17/11/2013 foi domingo, e 15/11 foi feriado no Brasil. Ativos brasileiros partem de 14/11/2013; os americanos, de 15/11. O fim é o fechamento de ${data(fim)}.</p>
        <p><b>Câmbio.</b> Ativos cotados lá fora foram convertidos pelo dólar PTAX do Banco Central na compra e na venda.</p>
        <p><b>Ações.</b> Só a variação do preço, corrigida por desdobramentos. Dividendos aparecem à parte, na Petrobras.</p>
        <p><b>CDI.</b> Rentabilidade acumulada dia a dia, com juros sobre juros.</p>
        <p><b>Gasolina e petróleo.</b> Comparação de preços: R$ 100 mil seriam comprar o produto em 2013 e vendê-lo hoje.</p>
      </div>
      <div class="aviso">${aviso} Não é recomendação de investimento.</div></div>
      <div class="rodape">Fontes: Banco Central, IBGE, ANP, B3, S&P Dow Jones Indices e Nasdaq via Yahoo Finance, CoinMetrics.</div>`;
  }
  el.innerHTML = h;
  await document.fonts.ready;
  document.body.dataset.pronto = "1";
})();
</script>
</body>
</html>
